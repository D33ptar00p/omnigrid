<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>OmniGrid — where the world's power comes from</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚡</text></svg>" />
  </head>
  <body>
    <div id="map"></div>

    <header id="brand">
      <h1>OmniGrid</h1>
      <p id="view-note">Every power source on Earth, from open data.</p>
    </header>

    <nav id="views" hidden>
      <button type="button" data-view="gb" class="on">Great Britain</button>
      <button type="button" data-view="global">World</button>
    </nav>

    <aside id="layers" hidden>
      <label>Layers</label>
      <ul>
        <li><label><input type="checkbox" id="layer-regions">
          Distribution regions</label></li>
        <li><label><input type="checkbox" id="layer-lines" checked>
          Transmission lines</label></li>
      </ul>
    </aside>

    <aside id="statusfilter" hidden>
      <label for="status-select">Project status</label>
      <select id="status-select">
        <option value="operating" selected>Operating only</option>
        <option value="operating+construction">Operating and under construction</option>
        <option value="">Everything, including cancelled</option>
      </select>
      <p class="opnote" id="status-note"></p>
    </aside>

    <aside id="opfilter" hidden>
      <label for="operator-select">Energy provider</label>
      <select id="operator-select"><option value="">All providers</option></select>
      <p class="opnote"></p>
    </aside>

    <div id="banner" hidden></div>

    <nav id="controls">
      <button id="legend-toggle" type="button">Legend</button>
      <button id="about-toggle" type="button">Data sources</button>
    </nav>
    <aside id="legend" hidden>
      <h2>Energy type</h2>
      <ul id="legend-items"></ul>
      <p class="legend-note" id="fuel-note">Circle size ∝ capacity. Click a type to show only that.</p>
      <div id="legend-gb" hidden>
        <h2>Distribution regions</h2>
        <div class="ramp"></div>
        <div class="ramp-ends"><span>0</span><span>4.5 GW embedded</span></div>
        <p class="legend-note">
          Shaded by embedded capacity, not fuel: Elexon declares no fuel for
          most of it. Dimmed points are outside the GB grid.
        </p>
      </div>
    </aside>

    <aside id="panel" hidden></aside>
    <div id="tooltip" hidden></div>

    <aside id="about" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
