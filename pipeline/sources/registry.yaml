# OmniGrid source registry — the single source of truth for provenance.
#
# Nothing may enter the pipeline without an entry here. This file generates:
#   - the in-app attribution panel        (data/dist/manifest.json)
#   - the methodology page reference list
#   - DATA_SOURCES.md
# Build fails if any output field cites a source_id absent from this file, or if
# any entry is missing `licence`, `attribution`, or `url`.
#
# `access`:  direct  = auto-downloadable by the pipeline
#            form    = behind a name/email form; must be vendored by hand
#            derived = authored by this project
# `role`:    input      = feeds the model
#            validation = deliberately held out to test the model
#            basemap    = cartographic only

schema_version: 1

sources:

  gem_gipt:
    name: Global Integrated Power Tracker
    short: "GEM"
    publisher: Global Energy Monitor
    version: "August 2026 release"
    url: https://globalenergymonitor.org/projects/global-integrated-power-tracker/
    download_url: https://globalenergymonitor.org/projects/global-integrated-power-tracker/download-data/
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Global Integrated Power Tracker, Global Energy Monitor, August 2026 release."
    access: form
    role: input
    raw_glob: "gem/*Integrated*Power*.xlsx"
    provides: [capacity_mw, fuel, status, owner, start_year, retired_year, location]
    notes: >-
      182,400 facilities, 22,296 GW, 200 countries. Unit-level; units are clustered
      into plants during normalisation. Download requires a name/email form, so the
      file is vendored into data/raw/gem/ and checksummed.

  gem_goget:
    name: Global Oil and Gas Extraction Tracker
    short: "GEM"
    publisher: Global Energy Monitor
    version: "March 2026 release"
    url: https://globalenergymonitor.org/projects/global-oil-gas-extraction-tracker/
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Global Oil and Gas Extraction Tracker, Global Energy Monitor, March 2026 release."
    access: form
    role: input
    raw_glob: "gem/*Oil*Gas*Extraction*.xls*"
    provides: [extraction_site, production, reserves, operator, location]

  gem_gcmt:
    name: Global Coal Mine Tracker
    short: "GEM"
    publisher: Global Energy Monitor
    version: "2026 release"
    url: https://globalenergymonitor.org/projects/global-coal-mine-tracker/
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Global Coal Mine Tracker, Global Energy Monitor, 2026 release."
    access: form
    role: input
    raw_glob: "gem/*Coal*Mine*.xls*"
    provides: [extraction_site, production, reserves, operator, location]

  wri_gppd:
    name: Global Power Plant Database
    short: "WRI"
    publisher: World Resources Institute
    version: "1.3.0"
    url: https://datasets.wri.org/datasets/global-power-plant-database
    download_url: https://wri-dataportal-prod.s3.amazonaws.com/manual/global_power_plant_database_v_1_3.zip
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Global Power Plant Database v1.3.0, World Resources Institute."
    access: direct
    role: input
    provides: [estimated_generation_gwh, capacity_mw, fuel]
    notes: >-
      Unmaintained since 2021. Used ONLY as a cross-check on modelled generation and
      as a degraded fallback when GEM files are not vendored. Never primary.

  osm_power:
    name: OpenStreetMap power infrastructure
    short: "OSM"
    publisher: OpenStreetMap contributors
    version: "planet, build date recorded at fetch"
    url: https://www.openstreetmap.org/
    licence: ODbL-1.0
    licence_url: https://opendatacommons.org/licenses/odbl/1-0/
    attribution: "© OpenStreetMap contributors, ODbL."
    access: direct
    role: input
    provides: [plant_footprint, transmission_line, substation]
    notes: "power=plant, power=generator, power=line, power=substation via Overpass/Geofabrik."

  kontur_pop:
    name: Kontur Population
    short: "Kontur"
    publisher: Kontur
    version: "3km H3 global"
    url: https://data.humdata.org/dataset/kontur-population-dataset-3km
    download_url: https://geodata-eu-central-1-kontur-public.s3.eu-central-1.amazonaws.com/kontur_datasets/kontur_population_20231101_r6.gpkg.gz
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: >-
      Kontur Population dataset, CC BY 4.0. Derived in part from OpenStreetMap
      (© OpenStreetMap contributors, ODbL) and Microsoft Buildings (ODbL).
    access: direct
    role: input
    provides: [population]
    notes: >-
      LICENCE RESOLVED 2026-09-12. Both Kontur and the HDX package metadata state
      CC BY (HDX license_id "cc-by"); the ODbL references describe Kontur's
      upstream inputs, not the distributed product. We attribute the upstream
      ODbL sources as well, which satisfies either reading at no cost. Fallback
      remains ghsl_pop if this is ever contested.

  ghsl_pop:
    name: Global Human Settlement Layer population grid
    short: "GHSL"
    publisher: European Commission Joint Research Centre
    version: "R2023A"
    url: https://human-settlement.emergency.copernicus.eu/ghs_pop.php
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "GHSL Global Human Settlement Layer, European Commission JRC."
    access: direct
    role: input
    provides: [population]
    notes: "Fallback population source if kontur_pop's licence cannot be resolved cleanly."

  ember_yearly:
    name: Yearly Electricity Data
    short: "Ember"
    publisher: Ember
    version: "Global Electricity Review yearly release, 2000-2022"
    url: https://ember-energy.org/data/yearly-electricity-data/
    download_url: https://ember-energy.org/app/uploads/2023/04/release_yearly_ger.csv
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Yearly Electricity Data, Ember, CC BY 4.0."
    access: direct
    role: input
    provides: [national_generation_gwh, national_demand_gwh, capacity_mw, emissions, net_imports]
    notes: >-
      215 geographies. The calibration target for capacity factors — the single
      biggest accuracy lever in the model.

  gridfinder:
    name: Derived map of global electricity transmission and distribution lines
    short: "gridfinder"
    publisher: World Bank / ESMAP
    version: "Zenodo record 3628142"
    url: https://energydata.info/dataset/derived-map-of-global-electricity-transmission-and-distribution-lines
    download_url: https://zenodo.org/record/3628142/files/
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "gridfinder, World Bank / ESMAP, CC BY 4.0."
    access: direct
    role: input
    provides: [predicted_line, grid_reach, lv_density]
    files: [grid.gpkg, targets.tif, lv.tif]
    notes: >-
      187 countries, ~70% accurate at 1 km. Feeds BOTH the cost matrix and the demand
      mask, so its errors compound — always blended against worldbank_electrification.

  worldbank_electrification:
    name: Access to electricity (% of population)
    short: "World Bank"
    publisher: World Bank
    version: "indicator EG.ELC.ACCS.ZS"
    url: https://data.worldbank.org/indicator/EG.ELC.ACCS.ZS
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "World Bank, Access to electricity (% of population), CC BY 4.0."
    access: direct
    role: input
    provides: [electrification_rate]

  natural_earth:
    name: Natural Earth admin boundaries
    short: "Natural Earth"
    publisher: Natural Earth
    version: "5.1.1 (50m cultural)"
    url: https://www.naturalearthdata.com/
    download_url: https://naciscdn.org/naturalearth/50m/cultural/ne_50m_admin_0_countries.zip
    licence: public-domain
    licence_url: https://www.naturalearthdata.com/about/terms-of-use/
    attribution: "Made with Natural Earth."
    access: direct
    role: input
    provides: [country_boundary]

  omnigrid_regions:
    name: Synchronous grid region table
    short: "OmniGrid"
    publisher: OmniGrid
    version: "1"
    url: https://github.com/omnigrid/omnigrid
    licence: CC0-1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    attribution: "OmniGrid synchronous grid region table, CC0."
    access: derived
    role: input
    provides: [synchronous_region, interconnector]
    notes: >-
      Authored. No canonical open dataset exists. ~40 major synchronous areas.
      Each entry carries its own source citation. This is where the model silently
      breaks if curation is wrong — China's six regional grids, Japan's 50/60 Hz
      split, Russia's UPS zones, Brazil's isolated systems, Australia NEM/SWIS/NT.

  protomaps_basemap:
    name: Protomaps basemap
    short: "Protomaps"
    publisher: Protomaps
    version: "daily planet build"
    url: https://protomaps.com/
    licence: ODbL-1.0
    licence_url: https://opendatacommons.org/licenses/odbl/1-0/
    attribution: "© OpenStreetMap contributors, ODbL. Basemap style © Protomaps (CC0)."
    access: direct
    role: basemap

  omnigrid_model:
    name: OmniGrid supply-shed model
    short: "OmniGrid model"
    publisher: OmniGrid
    version: "1"
    url: https://github.com/omnigrid/omnigrid
    licence: CC-BY-4.0
    licence_url: https://creativecommons.org/licenses/by/4.0/
    attribution: "OmniGrid modelled supply sheds, CC BY 4.0."
    access: derived
    role: model
    provides: [shed, population_served, hex_carbon_intensity, effective_area, reach_r50]
    notes: >-
      Entropy-regularised optimal transport (doubly-constrained gravity model),
      solved by unbalanced Sinkhorn per synchronous region. Every value citing this
      source is an estimate, never a measurement. See the methodology page.

  # ---- validation only: deliberately held out of the model ----

  epa_egrid:
    name: eGRID
    short: "eGRID"
    publisher: US Environmental Protection Agency
    version: "2024"
    url: https://www.epa.gov/egrid
    licence: public-domain
    licence_url: https://www.epa.gov/
    attribution: "eGRID, US Environmental Protection Agency."
    access: direct
    role: validation
    provides: [subregion_carbon_intensity]
    notes: "Primary lambda fitting target. Never an input to the allocation."

  entsoe:
    name: ENTSO-E Transparency Platform
    short: "ENTSO-E"
    publisher: ENTSO-E
    version: "current"
    url: https://transparency.entsoe.eu/
    licence: entsoe-terms
    licence_url: https://transparency.entsoe.eu/content/static_content/Static%20content/terms%20and%20conditions/terms%20and%20conditions.html
    attribution: "ENTSO-E Transparency Platform."
    access: direct
    role: validation
    provides: [bidding_zone_mix]
    blocking_issue: >-
      NOT A STANDARD OPEN LICENCE. The ENTSO-E Transparency Platform has its own
      terms of use: free to reuse with attribution, but requiring registration
      and not a CC/ODbL grant. Confirm those terms permit redistribution of
      derived validation figures before shipping anything that depends on it.
      eGRID (US public domain) carries the validation on its own in the meantime.

  hifld_territories:
    name: Electric Retail Service Territories
    short: "HIFLD"
    publisher: HIFLD / US Department of Homeland Security
    version: "archived 2025-08-26"
    url: https://catalog.data.gov/dataset/electric-retail-service-territories
    licence: public-domain
    licence_url: https://www.usa.gov/government-works
    attribution: "Electric Retail Service Territories, HIFLD."
    access: direct
    role: validation
    provides: [utility_service_territory]
    notes: >-
      Real regulated US/CA polygons. Sanity check on shed extent only — never an
      input. HIFLD Open was deactivated 2025-08-26; mirrored via Data Rescue Project.

  # ---- Great Britain: measured network and metered generation --------------

  elexon_bmu:
    name: BM Unit reference data
    short: "Elexon"
    publisher: Elexon
    version: "Insights Solution API"
    url: https://bmrs.elexon.co.uk/api-documentation/endpoint/reference/bmunits/all
    download_url: https://data.elexon.co.uk/bmrs/api/v1/reference/bmunits/all
    licence: elexon-bmrs
    licence_url: https://www.elexon.co.uk/bsc/data/balancing-mechanism-reporting-agent/copyright-licence-bmrs-data/
    attribution: "Contains BMRS data © Elexon Limited copyright and database right 2026."
    access: direct
    role: input
    provides: [bm_unit, fuel, capacity_mw, operator, gsp_group]
    notes: >-
      3,071 Balancing Mechanism Units, 1,682 with generation capacity. Carries
      gspGroupId, the published link from an embedded generator to the
      distribution region it feeds. No API key required. Worldwide royalty-free
      perpetual licence with a mandatory attribution string.

  elexon_b1610:
    name: Actual Generation Output Per Generation Unit (B1610)
    short: "Elexon"
    publisher: Elexon
    version: "Insights Solution API"
    url: https://bmrs.elexon.co.uk/api-documentation/endpoint/datasets/B1610
    download_url: https://data.elexon.co.uk/bmrs/api/v1/datasets/B1610
    licence: elexon-bmrs
    licence_url: https://www.elexon.co.uk/bsc/data/balancing-mechanism-reporting-agent/copyright-licence-bmrs-data/
    attribution: "Contains BMRS data © Elexon Limited copyright and database right 2026."
    access: direct
    role: input
    provides: [metered_generation_mwh]
    notes: >-
      Settlement-grade metered output per generating unit, half-hourly. This is
      measured electricity, not an estimate: it is the volume the unit is
      actually settled on.

  neso_dno_areas:
    name: GIS Boundaries for GB DNO Licence Areas
    short: "NESO"
    publisher: National Energy System Operator
    version: "20240503"
    url: https://www.neso.energy/data-portal/gis-boundaries-gb-dno-license-areas
    download_url: https://api.neso.energy/dataset/0e377f16-95e9-4c15-a1fc-49e06a39cfa0/resource/1c6a7dc0-1b6c-443a-bc67-5f7125649434/download/gb-dno-license-areas-20240503-as-geojson.geojson
    licence: NESO-open-data
    licence_url: https://www.neso.energy/data-portal/neso-open-licence
    attribution: "GIS Boundaries for GB DNO Licence Areas, National Energy System Operator, NESO Open Data Licence."
    access: direct
    role: input
    provides: [distribution_region]
    notes: >-
      The 14 licensed Distribution Network Operator areas, EPSG:27700. NESO
      publishes these as approximate: originally shared by Western Power
      Distribution, somewhat outdated, a good indication of geography rather
      than a surveyed boundary. Their Name field (_A, _B, ...) matches Elexon's
      gspGroupId, which is what makes the generator-to-region link published
      fact rather than inference.

  osm_gb_power:
    name: OpenStreetMap GB power infrastructure
    short: "OSM"
    publisher: OpenStreetMap contributors
    version: "live Overpass query"
    url: https://wiki.openstreetmap.org/wiki/Power_networks
    download_url: https://overpass-api.de/api/interpreter
    licence: ODbL-1.0
    licence_url: https://opendatacommons.org/licenses/odbl/1-0/
    attribution: "© OpenStreetMap contributors, ODbL."
    access: direct
    role: input
    provides: [plant_location, plant_footprint, transmission_line, substation]
    notes: >-
      Surveyed locations for GB power plants, transmission lines and
      substations. Queried by bounding box (49N-61.5N, 11.5W-3.5E) rather than
      by the UK admin area: the admin boundary is the land boundary, so an
      area query silently dropped every offshore wind farm beyond territorial
      waters, including Hornsea and Dogger Bank. The box also reaches France
      and Ireland, whose plants are classified out downstream. Matching an OSM
      plant to an Elexon BM Unit is a record link made by name, not a published
      identifier, and is marked as such per plant.

  wikidata:
    name: Wikidata and Wikimedia Commons
    short: "Wikidata"
    publisher: Wikimedia Foundation
    version: "live API"
    url: https://www.wikidata.org/
    licence: CC0-1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    attribution: "Structured data from Wikidata (CC0). Photographs from Wikimedia Commons, each under its own licence, credited to its author."
    access: direct
    role: input
    provides: [plant_photograph]
    notes: >-
      OpenStreetMap records a wikidata id for 451 GB plants; 169 of those have a
      photograph (property P18) on Wikimedia Commons. Wikidata's own structured
      data is CC0, but each photograph is licensed by its photographer -- usually
      CC BY or CC BY-SA -- so the author and licence are fetched with the image
      and shown beside it.
